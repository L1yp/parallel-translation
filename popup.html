<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2937;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      label {
        font-size: 12px;
        color: #6b7280;
        display: block;
        margin-bottom: 4px;
      }
      select {
        width: 100%;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 14px;
      }
      button {
        width: 100%;
        padding: 9px;
        font-size: 14px;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .hint {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 10px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>沉浸式翻译 Lite</h1>
    <label for="lang">目标语言</label>
    <select id="lang">
      <option value="zh-CN">中文（简体）</option>
      <option value="zh-TW">中文（繁体）</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>
    <button id="go">翻译 / 还原</button>
    <p class="hint">点击按钮翻译当前页面，再次点击还原。安装后请刷新已打开的页面。</p>
    <script src="popup.js"></script>
  </body>
</html>
