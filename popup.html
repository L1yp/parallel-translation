<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px 16px;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2937;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      label {
        font-size: 12px;
        color: #6b7280;
        display: block;
        margin-bottom: 4px;
      }
      select,
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 10px;
        background: #fff;
        box-sizing: border-box;
        font-family: inherit;
      }
      .row-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 8px;
      }
      .row-check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #374151;
        margin: 0 0 10px;
      }
      .row-check input {
        margin: 0;
      }
      button {
        width: 100%;
        padding: 9px;
        font-size: 14px;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .group {
        border-top: 1px solid #e5e7eb;
        margin-top: 12px;
        padding-top: 10px;
      }
      .group-title {
        font-size: 11px;
        font-weight: 600;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 8px;
      }
      .cred-tip {
        display: none;
        font-size: 11px;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 0 0 10px;
        line-height: 1.5;
      }
      .cred-tip.show {
        display: block;
      }
      .cred-tip a {
        color: #b45309;
        text-decoration: underline;
        cursor: pointer;
      }
      .footer-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-size: 11px;
        color: #9ca3af;
        line-height: 1.5;
      }
      .footer-bar a {
        color: #2563eb;
        text-decoration: none;
        cursor: pointer;
      }
      .footer-bar a:hover {
        text-decoration: underline;
      }
      .site-link-row {
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.5;
      }
      .site-link-row a {
        color: #2563eb;
        text-decoration: none;
        cursor: pointer;
      }
      .site-link-row a:hover {
        text-decoration: underline;
      }
      .site-link-row .host {
        color: #6b7280;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
      }
      kbd {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 10px;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <h1>沉浸式翻译 Lite</h1>

    <div class="group" style="border-top: none; margin-top: 0; padding-top: 0;">
      <h2 class="group-title">基础翻译</h2>

      <div class="row-2col">
        <div>
          <label for="lang">目标语言</label>
          <select id="lang">
            <option value="zh-CN">中文（简体）</option>
            <option value="zh-TW">中文（繁体）</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
          </select>
        </div>
        <div>
          <label for="provider">翻译服务</label>
          <select id="provider">
            <option value="google">Google</option>
            <option value="microsoft">Microsoft</option>
            <option value="youdao">有道</option>
          </select>
        </div>
      </div>

      <div id="cred-tip" class="cred-tip">
        未配置 <span id="cred-tip-what"></span>，<a id="cred-tip-link">前往设置</a>。
      </div>

      <label for="style">译文样式</label>
      <select id="style">
        <option value="default">默认（蓝色虚线）</option>
        <option value="underline">下划线</option>
        <option value="blur">模糊（悬停显示）</option>
        <option value="bold">加粗</option>
        <option value="card">卡片</option>
      </select>

      <label class="row-check">
        <input type="checkbox" id="observer" />
        自动翻译动态加载的内容
      </label>
    </div>

    <div class="group">
      <h2 class="group-title">悬停翻译</h2>
      <label for="hover">触发方式</label>
      <select id="hover">
        <option value="off">关闭</option>
        <option value="alt">按住 Alt + 悬停</option>
        <option value="ctrl">按住 Ctrl + 悬停</option>
        <option value="shift">按住 Shift + 悬停</option>
      </select>
    </div>

    <div class="group">
      <h2 class="group-title">划词翻译</h2>
      <label for="selection-translate">触发方式</label>
      <select id="selection-translate">
        <option value="off">关闭</option>
        <option value="button">选中后显示翻译按钮</option>
        <option value="auto">选中即自动翻译</option>
      </select>
    </div>

    <div class="group">
      <h2 class="group-title">输入框翻译</h2>

      <label for="input-translate">触发方式</label>
      <select id="input-translate">
        <option value="off">关闭</option>
        <option value="space3">连按 3 次空格触发</option>
      </select>

      <div class="row-2col">
        <div>
          <label for="input-source-lang">源语言</label>
          <select id="input-source-lang">
            <option value="auto">自动检测</option>
            <option value="zh-CN">中文（简体）</option>
            <option value="zh-TW">中文（繁体）</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
          </select>
        </div>
        <div>
          <label for="input-target-lang">目标语言</label>
          <select id="input-target-lang">
            <option value="en">English</option>
            <option value="zh-CN">中文（简体）</option>
            <option value="zh-TW">中文（繁体）</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
          </select>
        </div>
      </div>
    </div>

    <div class="group">
      <button id="go">翻译 / 还原</button>
      <div class="footer-bar">
        <span>快捷键 <kbd>Alt</kbd>+<kbd>T</kbd> 切换</span>
        <a id="open-options">⚙ 更多设置</a>
      </div>
      <div class="site-link-row" id="customize-site-row" style="display: none;">
        <a id="customize-site">🎯 为当前站点定制规则</a>
        <span class="host" id="customize-site-host"></span>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
