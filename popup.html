<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2937;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      label {
        font-size: 12px;
        color: #6b7280;
        display: block;
        margin-bottom: 4px;
      }
      select,
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 6px 8px;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 12px;
        background: #fff;
        box-sizing: border-box;
        font-family: inherit;
      }
      .row-check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #374151;
        margin: 0 0 14px;
      }
      .row-check input {
        margin: 0;
      }
      button {
        width: 100%;
        padding: 9px;
        font-size: 14px;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button.secondary {
        background: #f3f4f6;
        color: #374151;
        margin-bottom: 10px;
      }
      button.secondary:hover {
        background: #e5e7eb;
      }
      .hint {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 10px;
        line-height: 1.5;
      }
      .section {
        border-top: 1px solid #e5e7eb;
        margin-top: 14px;
        padding-top: 12px;
      }
      .section.hidden {
        display: none;
      }
      .test-status {
        font-size: 11px;
        line-height: 1.5;
        margin: -6px 0 8px;
        min-height: 14px;
        color: #6b7280;
      }
      .test-status.ok {
        color: #16a34a;
      }
      .test-status.err {
        color: #dc2626;
      }
      kbd {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 10px;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 3px;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <h1>沉浸式翻译 Lite</h1>

    <label for="lang">目标语言</label>
    <select id="lang">
      <option value="zh-CN">中文（简体）</option>
      <option value="zh-TW">中文（繁体）</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>

    <label for="provider">翻译服务</label>
    <select id="provider">
      <option value="google">Google（免费）</option>
      <option value="microsoft">Microsoft Translator</option>
    </select>

    <div id="ms-config" class="section hidden">
      <label for="ms-key">Microsoft API Key</label>
      <input type="password" id="ms-key" placeholder="32 位密钥" autocomplete="off" />

      <label for="ms-region">Region（资源所在区域）</label>
      <input type="text" id="ms-region" placeholder="eastasia / japaneast / ..." />

      <button id="ms-test" class="secondary">测试连接</button>
      <div id="ms-test-status" class="test-status"></div>
    </div>

    <div class="section">
      <label for="style">译文样式</label>
      <select id="style">
        <option value="default">默认（蓝色虚线）</option>
        <option value="underline">下划线</option>
        <option value="blur">模糊（悬停显示）</option>
        <option value="bold">加粗</option>
        <option value="card">卡片</option>
      </select>

      <label for="hover">悬停翻译</label>
      <select id="hover">
        <option value="off">关闭</option>
        <option value="alt">按住 Alt + 悬停</option>
        <option value="ctrl">按住 Ctrl + 悬停</option>
        <option value="shift">按住 Shift + 悬停</option>
      </select>

      <label class="row-check">
        <input type="checkbox" id="observer" />
        自动翻译动态加载的内容
      </label>
    </div>

    <button id="go">翻译 / 还原</button>
    <p class="hint">
      快捷键 <kbd>Alt</kbd>+<kbd>T</kbd> 也能开关整页翻译。<br />
      切换服务或更新 Key 后需重新点"翻译 / 还原"。
    </p>
    <script src="popup.js"></script>
  </body>
</html>
