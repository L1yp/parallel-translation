<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>沉浸式翻译 Lite — 设置</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        max-width: 560px;
        margin: 0 auto;
        padding: 28px 32px 48px;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .subtitle {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 20px 22px;
        margin-bottom: 18px;
      }
      .card h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .card .desc {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 16px;
        line-height: 1.5;
      }
      label {
        font-size: 12px;
        color: #6b7280;
        display: block;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        margin-bottom: 14px;
        background: #fff;
        box-sizing: border-box;
        font-family: inherit;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      button {
        padding: 8px 14px;
        font-size: 13px;
        color: #374151;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #e5e7eb;
      }
      .test-status {
        font-size: 12px;
        line-height: 1.5;
        margin-top: 10px;
        min-height: 16px;
        color: #6b7280;
      }
      .test-status.ok {
        color: #16a34a;
      }
      .test-status.err {
        color: #dc2626;
      }
      .saved-hint {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 6px;
        height: 14px;
        transition: opacity 0.3s;
      }
      .saved-hint.show {
        color: #16a34a;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .footer {
        font-size: 11px;
        color: #9ca3af;
        text-align: center;
        margin-top: 24px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>沉浸式翻译 Lite — 设置</h1>
    <p class="subtitle">所有改动会自动保存。</p>

    <div class="card">
      <h2>Microsoft Translator</h2>
      <p class="desc">
        使用 Azure 认知服务的 Translator 资源。需要在
        <a href="https://portal.azure.com/" target="_blank" rel="noopener">Azure 门户</a>
        创建资源后获取 Key 与所在 Region。免费层 F0 每月 200 万字符。
      </p>

      <label for="ms-key">API Key</label>
      <input type="password" id="ms-key" placeholder="32 位密钥" autocomplete="off" spellcheck="false" />

      <label for="ms-region">Region（资源所在区域）</label>
      <input type="text" id="ms-region" placeholder="eastasia / japaneast / ..." spellcheck="false" />

      <button id="ms-test">测试连接</button>
      <div id="ms-test-status" class="test-status"></div>
      <div id="saved-hint" class="saved-hint"></div>
    </div>

    <p class="footer">
      切换翻译服务、目标语言、译文样式等常用选项请打开扩展弹窗。<br />
      快捷键 Alt+T 也能开关整页翻译。
    </p>

    <script src="options.js"></script>
  </body>
</html>
